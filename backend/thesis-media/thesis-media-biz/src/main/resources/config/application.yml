server:
  port: ${SERVER_PORT:8086} # 项目启动的端口F

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml


grpc:
  # 作为grpc服务端的配置
  server:
    port: ${GRPC_SERVER_PORT:50051}
    # 启用反射服务（开发环境）
    enable-reflection: true
    # 最大消息大小 (10MB)
    max-inbound-message-size: 10485760
    # 启用健康检查
    health-service-enabled: true
    # 启用 keep-alive
    permit-keep-alive-without-calls: true
    permit-keep-alive-time: 300s
  # gRPC Client 配置
  client:
    # 配置 Node.js SFU 服务端
    sfu-node-service:
      address: ${SFU_NODE_GRPC_ADDRESS:static://localhost:50052}
      negotiation-type: plaintext
      max-inbound-message-size: 10485760
      # 启用 keep-alive
      enable-keep-alive: true
      keep-alive-time: 300s
      keep-alive-timeout: 20s
      # 重试配置
      retry: true
      max-attempts: 3


sfu:
  discovery:
    service-name: ${SFU_DISCOVERY_SERVICE_NAME:sfu-server}
  server:
    url: ${SFU_SERVER_URL:ws://localhost:3000}

