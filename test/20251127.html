<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Rust SFU Demo</title>
		<style>
			video {
				width: 45%;
				border: 1px solid black;
				background: #333;
			}
			.container {
				display: flex;
				justify-content: space-around;
			}
		</style>
	</head>
	<body>
		<h1>Rust SFU Demo (Localhost)</h1>
		<div class="container">
			<div>
				<h3>Publisher (Local Camera)</h3>
				<video id="localVideo" autoplay muted playsinline></video>
				<br />
				<button onclick="startPublish()">1. Start Publish</button>
			</div>
			<div>
				<h3>Subscriber (Remote Stream)</h3>
				<video id="remoteVideo" autoplay playsinline></video>
				<br />
				<button onclick="startSubscribe()">2. Start Subscribe</button>
			</div>
		</div>

		<script>
			const sfuUrl = "http://127.0.0.1:8080";

			// --- Publisher Logic ---
			async function startPublish() {
				const pc = new RTCPeerConnection({
					iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
				});

				// 获取摄像头
				const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
				document.getElementById("localVideo").srcObject = stream;

				// 添加 Track 到 PC
				stream.getTracks().forEach((track) => pc.addTrack(track, stream));

				// 创建 Offer
				const offer = await pc.createOffer();
				await pc.setLocalDescription(offer);

				// 等待 ICE 收集完成 (简化版)
				await new Promise((resolve) => {
					if (pc.iceGatheringState === "complete") resolve();
					else
						pc.onicecandidate = (e) => {
							if (!e.candidate) resolve();
						};
				});

				// 发送 Offer 到 Rust SFU
				const response = await fetch(sfuUrl + "/publish", {
					method: "POST",
					body: JSON.stringify(pc.localDescription.sdp),
					headers: { "Content-Type": "application/json" },
				});

				const answerSdp = await response.json();
				await pc.setRemoteDescription(
					new RTCSessionDescription({ type: "answer", sdp: answerSdp })
				);
				console.log("Publish Success!");
			}

			// --- Subscriber Logic ---
			async function startSubscribe() {
				const pc = new RTCPeerConnection({
					iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
				});

				// 接收远端流
				pc.ontrack = (event) => {
					console.log("✅ Received Remote Track:", event.track.kind);
					console.log("Remote Stream ID:", event.streams[0].id);
					console.log("Track readyState:", event.track.readyState);
					console.log("Track muted:", event.track.muted);

					const remoteVideo = document.getElementById("remoteVideo");
					const stream = event.streams[0];

					// 设置 srcObject
					remoteVideo.srcObject = stream;

					// 监听视频元数据加载
					remoteVideo.onloadedmetadata = () => {
						console.log("📹 Video metadata loaded");
						console.log(
							"Video dimensions:",
							remoteVideo.videoWidth,
							"x",
							remoteVideo.videoHeight
						);
					};

					// 监听视频开始播放
					remoteVideo.onplay = () => {
						console.log("▶️ Video started playing");
					};

					// 监听播放错误
					remoteVideo.onerror = (e) => {
						console.error("❌ Video error:", e);
					};

					// 强制播放
					remoteVideo.play().catch((e) => {
						console.error("播放失败:", e);
					});

					// 检查 stream 的 tracks
					console.log(
						"Stream tracks:",
						stream.getTracks().map((t) => ({
							kind: t.kind,
							enabled: t.enabled,
							muted: t.muted,
							readyState: t.readyState,
						}))
					);
				};

				// 监听连接状态
				pc.onconnectionstatechange = () => {
					console.log("Connection State:", pc.connectionState);
				};

				pc.oniceconnectionstatechange = () => {
					console.log("ICE Connection State:", pc.iceConnectionState);
				};

				// 必须添加一个 Transceiver 才能接收视频 (recvonly)
				pc.addTransceiver("video", { direction: "recvonly" });

				const offer = await pc.createOffer();
				await pc.setLocalDescription(offer);

				console.log("📤 Sending Offer to SFU...");

				await new Promise((resolve) => {
					if (pc.iceGatheringState === "complete") resolve();
					else
						pc.onicecandidate = (e) => {
							if (!e.candidate) resolve();
						};
				});

				const response = await fetch(sfuUrl + "/subscribe", {
					method: "POST",
					body: JSON.stringify(pc.localDescription.sdp),
					headers: { "Content-Type": "application/json" },
				});

				const answerSdp = await response.json();
				console.log("📥 Received Answer from SFU");

				await pc.setRemoteDescription(
					new RTCSessionDescription({ type: "answer", sdp: answerSdp })
				);
				console.log("Subscribe Success!");
			}
		</script>
	</body>
</html>
