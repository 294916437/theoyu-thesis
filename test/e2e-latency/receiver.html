<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<title>E2E延迟测试 - 接收端</title>
		<style>
			body {
				font-family: monospace;
				background: #1a1a1a;
				color: #eee;
				padding: 20px;
			}
			#status {
				margin: 10px 0;
				padding: 10px;
				background: #333;
				border-radius: 4px;
				white-space: pre-wrap;
				max-height: 200px;
				overflow-y: auto;
			}
			#remote-video {
				border: 1px solid #555;
				display: block;
				margin: 10px 0;
				background: #000;
			}
			#sample-canvas {
				border: 1px solid #555;
				display: block;
				margin: 10px 0;
			}
			#results {
				margin: 10px 0;
				padding: 10px;
				background: #222;
				border-radius: 4px;
			}
			label {
				display: block;
				margin: 6px 0 2px;
			}
			input,
			button {
				padding: 6px 12px;
				margin: 4px 0;
			}
			button {
				background: #0078d4;
				color: white;
				border: none;
				border-radius: 4px;
				cursor: pointer;
			}
			button:hover {
				background: #106ebe;
			}
			.section {
				margin: 16px 0;
				border-top: 1px solid #555;
				padding-top: 12px;
			}
			table {
				border-collapse: collapse;
				width: 100%;
				margin-top: 8px;
			}
			th,
			td {
				border: 1px solid #555;
				padding: 6px 10px;
				text-align: center;
			}
			th {
				background: #333;
			}
			.highlight {
				color: #4fc3f7;
				font-weight: bold;
			}
		</style>
	</head>
	<body>
		<h2>📥 E2E延迟测试 — 接收端</h2>
		<div class="section">
			<label>SFU 地址（Socket.io URL）</label>
			<input id="sfuUrl" value="http://localhost:3000" style="width: 280px" />
			<label>房间 ID（须与发送端一致）</label>
			<input id="roomId" value="e2e-test-room" />
			<label>用户 ID</label>
			<input id="userId" value="receiver-001" />
			<label>昵称</label>
			<input id="username" value="接收端" />
			<label>Token</label>
			<input id="token" value="test-token" />
			<label>参与者规模（仅用于标注，如 2/3/5）</label>
			<input id="participantCount" value="2" type="number" min="2" max="20" />
			<label>发送端用户名（多人测试时精准订阅 QR 流，留空则订阅第一个视频流）</label>
			<input id="senderUsername" value="" placeholder="留空=订阅第一个视频流" />
			<label>采样次数（默认 60）</label>
			<input id="sampleCount" value="60" type="number" min="10" max="500" />
			<br />
			<button onclick="startReceiver()">🚀 加入房间并开始采样</button>
			<button onclick="stopReceiver()" style="background: #c62828">⏹ 停止</button>
			<button onclick="exportResults()" style="background: #2e7d32">💾 导出 JSON</button>
		</div>
		<div id="status">等待操作…</div>

		<!-- 接收到的远程视频 -->
		<label>远程视频帧</label>
		<video id="remote-video" width="640" height="480" autoplay muted playsinline></video>

		<!-- 采样 Canvas（用于读取像素）-->
		<canvas id="sample-canvas" width="640" height="38" style="display: none"></canvas>
		<!-- 帧捕获 Canvas（jsQR QR 码解码用）-->
		<canvas id="capture-canvas" width="640" height="480" style="display: none"></canvas>

		<div class="section">
			<h3>📊 实时结果</h3>
			<div id="results">
				<table>
					<thead>
						<tr>
							<th>参与者规模</th>
							<th>已采样次数</th>
							<th>E2E延迟均值 (ms)</th>
							<th>E2E延迟最大值 (ms)</th>
							<th>当前延迟 (ms)</th>
							<th>RTCP RTT均值 (ms)</th>
						</tr>
					</thead>
					<tbody id="results-body">
						<tr>
							<td colspan="6">—</td>
						</tr>
					</tbody>
				</table>
			</div>
			<div id="raw-data" style="margin-top: 8px; color: #aaa; font-size: 12px; max-height: 120px; overflow-y: auto"></div>
		</div>

		<script type="module">
			import { io } from "socket.io-client"
			import jsQR from "jsqr"
			import { Device } from "mediasoup-client"
			let socket = null
			let device = null
			let recvTransport = null
			let activeConsumer = null // 只关注第一个 video consumer
			let samplingActive = false
			let sampleResults = []
			let rttSamples = []
			let animFrameId = null

			const videoEl = document.getElementById("remote-video")
			const sampleCanvas = document.getElementById("sample-canvas")
			const sampleCtx = sampleCanvas.getContext("2d", { willReadFrequently: true })
			const captureCanvas = document.getElementById("capture-canvas")
			const captureCtx = captureCanvas.getContext("2d", { willReadFrequently: true })

			// ─── 日志 ────────────────────────────────────────────────────────────────
			function log(msg) {
				const el = document.getElementById("status")
				el.innerText = new Date().toLocaleTimeString() + "  " + msg + "\n" + el.innerText
				console.log("[Receiver]", msg)
			}

			function emitAsync(eventName, data) {
				return new Promise((resolve, reject) => {
					socket.emit(eventName, data, (response) => {
						if (response && response.error) return reject(new Error(response.error))
						resolve(response)
					})
				})
			}

			// ─── jsQR 初始化（QR 码解码方案） ────────────────────────────────────────────────────────
			/**
			 * 接收端从实际视频帧中解码 QR 码获取发送时刻：
			 *   - 发送端在每帧右下角绘制 QR 码，内容为当前 Date.now()（13 位 Unix ms）
			 *   - 接收端通过 requestVideoFrameCallback 获取帧展示时刻 (now: performance.now())
			 *   - 将视频帧绘入 captureCanvas，调用 jsQR() 同步解码 QR 码
			 *   - E2E 延迟 = (now + performance.timeOrigin) − sentTs
			 * jsQR 是纯 JS 实现，兼容所有现代浏览器，不依赖浏览器内置 API。
			 */
			let videoFrameReceived = false

			function initBarcodeDetector() {
				log("jsQR 已初始化（纯 JS QR 解码，兼容所有现代浏览器）")
				return true
			}

			// ─── RTCP RTT 采集（via WebRTC stats API） ────────────────────────────────
			async function collectRTT() {
				if (!recvTransport) return null
				try {
					const stats = await recvTransport.getStats()
					for (const [, stat] of stats) {
						if (stat.type === "candidate-pair" && stat.nominated) {
							// currentRoundTripTime 单位是秒,如果不存在则 fallback 为 0
							const rttSec = stat.currentRoundTripTime || 0
							return Math.round(rttSec * 1000)
						}
					}
				} catch (_) {}
				return null
			}

			// ─── 采样循环（requestVideoFrameCallback + jsQR 解码） ──────────────────────
			function startSampling() {
				const targetCount = parseInt(document.getElementById("sampleCount").value) || 60
				samplingActive = true
				sampleResults = []
				rttSamples = []
				log(`开始采样（jsQR 解码），目标 ${targetCount} 次…`)

				let lastSentTs = 0

				function sampleFrame(now) {
					if (!samplingActive) return

					if (sampleResults.length >= targetCount) {
						samplingActive = false
						finalizeSampling()
						return
					}

					let decodeSuccess = false

					if (videoEl.readyState >= 2 && videoEl.videoWidth > 0) {
						// 1. 绘入 captureCanvas（在 getImageData 前完成，保证帧与 now 对齐）
						captureCtx.drawImage(videoEl, 0, 0, 640, 480)

						// 2. 只对 QR 码所在的右下角裁剪，减少 jsQR 扫描面积提升性能
						const qrRegion = captureCtx.getImageData(404, 244, 236, 236)

						// 二值化处理，消除视频压缩带来的边缘伪影模糊，大幅提升 jsQR 解码成功率
						const data = qrRegion.data
						for (let i = 0; i < data.length; i += 4) {
							const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114
							const val = gray > 140 ? 255 : 0
							data[i] = val
							data[i + 1] = val
							data[i + 2] = val
						}

						const code = jsQR(qrRegion.data, qrRegion.width, qrRegion.height, { inversionAttempts: "dontInvert" })
						if (code) {
							const sentTs = parseInt(code.data)
							if (!isNaN(sentTs) && sentTs > 1_000_000_000_000 && sentTs !== lastSentTs) {
								lastSentTs = sentTs
								decodeSuccess = true
								const recvWallMs = now + performance.timeOrigin
								const latency = Math.round(recvWallMs - sentTs)
								if (latency > 0 && latency < 5000) {
									sampleResults.push(latency)
									appendRawData(sampleResults.length, sentTs, Math.round(recvWallMs), latency)
									updateResultsTable()

									// 每次采样都更新 RTCP RTT 保证样本充足
									collectRTT().then((rtt) => {
										if (rtt !== null && rtt > 0) rttSamples.push(rtt)
									})
								}
							}
						}
					}

					// 如果解码成功，等待 400ms 再采下一帧以分散样本；如果失败或重复，立即尝试下一帧
					if (decodeSuccess) {
						setTimeout(() => requestNext(), 400)
					} else {
						requestNext()
					}
				}

				function requestNext() {
					if (!samplingActive) return
					if (typeof videoEl.requestVideoFrameCallback === "function") {
						videoEl.requestVideoFrameCallback(sampleFrame)
					} else {
						requestAnimationFrame(() => sampleFrame(performance.now()))
					}
				}

				// 启动首次采样
				requestNext()
			} // end startSampling

			function finalizeSampling() {
				if (sampleResults.length === 0) {
					log("无有效采样数据")
					return
				}
				const avg = Math.round(sampleResults.reduce((a, b) => a + b, 0) / sampleResults.length)
				const max = Math.max(...sampleResults)
				const avgRtt = rttSamples.length > 0 ? Math.round(rttSamples.reduce((a, b) => a + b, 0) / rttSamples.length) : "—"
				log(`采样完成 | E2E均值=${avg}ms | E2E最大值=${max}ms | RTCP RTT均值=${avgRtt}ms | 有效样本=${sampleResults.length}`)
				updateResultsTable(avg, max, avgRtt)
			}

			function updateResultsTable(avg, max, avgRtt) {
				const n = sampleResults.length
				const curAvg = avg !== undefined ? avg : n > 0 ? Math.round(sampleResults.reduce((a, b) => a + b, 0) / n) : 0
				const curMax = max !== undefined ? max : n > 0 ? Math.max(...sampleResults) : 0
				const latest = sampleResults[n - 1] || 0
				const scale = document.getElementById("participantCount").value
				const rttDisplay = avgRtt !== undefined ? avgRtt : rttSamples.length > 0 ? Math.round(rttSamples.reduce((a, b) => a + b, 0) / rttSamples.length) : "—"
				document.getElementById("results-body").innerHTML = `
					<tr>
						<td>${scale} 人</td>
						<td class="highlight">${n}</td>
						<td class="highlight">${curAvg}</td>
						<td class="highlight">${curMax}</td>
						<td>${latest}</td>
						<td class="highlight">${rttDisplay}</td>
					</tr>`
			}

			function appendRawData(idx, sentTs, recvTs, latency) {
				const el = document.getElementById("raw-data")
				el.innerText = `[${idx}] sentTs=${sentTs} recvTs=${recvTs} latency=${latency}ms\n` + el.innerText
			}

			// ─── 主流程 ─────────────────────────────────────────────────────────────
			async function startReceiver() {
				if (!initBarcodeDetector()) return

				const sfuUrl = document.getElementById("sfuUrl").value.trim()
				const rid = document.getElementById("roomId").value.trim()
				const uid = document.getElementById("userId").value.trim()
				const uname = document.getElementById("username").value.trim()
				const token = document.getElementById("token").value.trim()

				log("连接 SFU…")
				socket = io(sfuUrl, { auth: { token }, transports: ["websocket"] })
				await new Promise((res, rej) => {
					socket.on("connect", res)
					socket.on("connect_error", rej)
				})
				log("Socket 已连接，加入房间…")

				const joinResp = await emitAsync("joinRoom", { roomId: rid, userId: uid, username: uname, token })
				log(`已加入房间，peerId=${joinResp.peerId}，其他参与者：${joinResp.peers.length}`)

				const { rtpCapabilities } = await emitAsync("getRouterRtpCapabilities", { roomId: rid })
				device = new Device()
				await device.load({ routerRtpCapabilities: rtpCapabilities })
				log("路由 RTP 能力已加载")

				// Recv Transport
				const recvParams = await emitAsync("createWebRtcTransport", { roomId: rid, producing: false, consuming: true })
				recvTransport = device.createRecvTransport(recvParams)
				log("接收传输已建立")

				recvTransport.on("connectionstatechange", (state) => {
					log(`[ICE/DTLS] Receiver Transport Connection State: ${state}`)
				})

				recvTransport.on("connect", ({ dtlsParameters }, callback, errback) => {
					emitAsync("connectWebRtcTransport", { roomId: rid, transportId: recvParams.id, dtlsParameters }).then(callback).catch(errback)
				})

				// 从输入框读取发送端用户名（多人测试时精准订阅含 QR 码的视频流）
				const senderUname = document.getElementById("senderUsername").value.trim()
				function isTargetSender(peerUsername) {
					return !senderUname || peerUsername === senderUname
				}

				// 订阅已有参与者的视频（优先匹配发送端用户名）
				log(`扫描已入场 peer：${joinResp.peers.length} 个，开始订阅视频…`)
				for (const peer of joinResp.peers) {
					for (const producer of peer.producers || []) {
						if (producer.kind === "video" && !activeConsumer && isTargetSender(peer.username)) {
							await subscribeVideoProducer(producer.id, rid)
						}
					}
				}

				// 监听新 Producer（单一监听器，避免重复注册；采样触发已内聚于 subscribeVideoProducer）
				socket.on("newProducer", async ({ producerId, kind, username }) => {
					if (kind === "video" && !activeConsumer && isTargetSender(username)) {
						await subscribeVideoProducer(producerId, rid)
					}
				})

				if (!activeConsumer) {
					log("暂未发现目标视频生产者，等待 newProducer 事件…")
				}
			}

			async function subscribeVideoProducer(producerId, rid) {
				log(`订阅视频 producer=${producerId}…`)
				try {
					const consumerParams = await emitAsync("consume", {
						roomId: rid,
						producerId,
						rtpCapabilities: device.rtpCapabilities,
					})
					activeConsumer = await recvTransport.consume(consumerParams)
					await emitAsync("resumeConsumer", { roomId: rid, consumerId: activeConsumer.id })

					// 在 srcObject 赋值前就注册监听器，避免 loadeddata 在 await play() 期间触发而错过
					videoEl.addEventListener(
						"loadeddata",
						() => {
							if (!videoFrameReceived) {
								videoFrameReceived = true
								startSampling()
							}
						},
						{ once: true },
					)

					activeConsumer.track.onunmute = () => {
						log(`[Track] track 已解除静音，开始接收 RTP 包...`)
					}
					activeConsumer.track.onmute = () => {
						log(`[Track] track 被静音 (通常意味着没收到包)...`)
					}

					// 绑定到 video 元素
					videoEl.srcObject = new MediaStream([activeConsumer.track])

					videoEl.play().catch((e) => log(`play() 失败: ${e?.message || e}`))
					log(`已订阅视频 producer=${producerId}，等待帧数据 (readyState: ${activeConsumer.track.readyState}, muted: ${activeConsumer.track.muted})…`)

					if (videoEl.readyState >= 2 && !videoFrameReceived) {
						videoFrameReceived = true
						startSampling()
					}

					// 兜底超时：3s 后若 loadeddata 与 readyState 均未触发采样，强制启动
					setTimeout(() => {
						if (!videoFrameReceived && activeConsumer) {
							log("loadeddata 未触发，强制启动采样…")
							videoFrameReceived = true
							startSampling()
						}
					}, 3000)
				} catch (e) {
					log("订阅失败: " + e.message)
				}
			}

			// 将 onclick 引用的函数暴露到 window（module 脚本默认作用域隔离）
			window.startReceiver = startReceiver
			window.stopReceiver = stopReceiver
			window.exportResults = exportResults

			function stopReceiver() {
				samplingActive = false
				if (animFrameId) {
					cancelAnimationFrame(animFrameId)
					animFrameId = null
				}
				if (socket) {
					socket.disconnect()
					socket = null
				}
				if (recvTransport) {
					recvTransport.close()
					recvTransport = null
				}
				activeConsumer = null
				videoFrameReceived = false
				log("已停止")
			}

			function exportResults() {
				const n = sampleResults.length
				if (n === 0) {
					alert("暂无数据")
					return
				}
				const avg = Math.round(sampleResults.reduce((a, b) => a + b, 0) / n)
				const max = Math.max(...sampleResults)
				const avgRtt = rttSamples.length > 0 ? Math.round(rttSamples.reduce((a, b) => a + b, 0) / rttSamples.length) : null
				const scale = document.getElementById("participantCount").value
				const data = {
					participantCount: parseInt(scale),
					sampleCount: n,
					avgLatencyMs: avg,
					maxLatencyMs: max,
					avgRttMs: avgRtt,
					rawSamples: sampleResults,
					rttSamples: rttSamples,
					collectedAt: new Date().toISOString(),
				}
				const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" })
				const a = document.createElement("a")
				a.href = URL.createObjectURL(blob)
				a.download = `e2e-latency-${scale}p-${Date.now()}.json`
				a.click()
			}
		</script>
	</body>
</html>
