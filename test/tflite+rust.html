<!DOCTYPE html>
<html>
	<head>
		<title>MediaPipe SDK + Rust Wasm</title>
		<!-- 1. 引入 MediaPipe Selfie Segmentation 库 -->
		<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>
		<style>
			body {
				background: #222;
				color: white;
				display: flex;
				flex-direction: column;
				align-items: center;
			}
			canvas {
				border: 1px solid #666;
				margin: 10px;
				max-width: 100%;
			}
			.container {
				position: relative;
			}
		</style>
	</head>
	<body>
		<h1>MediaPipe SDK + Rust JBF</h1>
		<div class="container">
			<!-- 原始视频隐藏，只用于采集 -->
			<video id="video" style="display: none" playsinline></video>
			<!-- 最终渲染输出 -->
			<canvas id="output"></canvas>
		</div>
		<div id="stats">Loading MediaPipe...</div>

		<script type="module">
			import init, { MeetProcessor, init_panic_hook } from "./pkg/meet_background_effect.js"

			const WIDTH = 640
			const HEIGHT = 480
			const MASK_WIDTH = 256
			const MASK_HEIGHT = 144

			async function main() {
				// 1. 初始化 Rust
				const wasm = await init()
				init_panic_hook()
				const processor = MeetProcessor.new(WIDTH, HEIGHT)

				const canvas = document.getElementById("output")
				canvas.width = WIDTH
				canvas.height = HEIGHT
				const ctx = canvas.getContext("2d", { willReadFrequently: true })

				// 离屏 Canvas 用于处理 Mask
				const maskCanvas = new OffscreenCanvas(MASK_WIDTH, MASK_HEIGHT)
				const maskCtx = maskCanvas.getContext("2d", { willReadFrequently: true })

				// 状态标记
				let isModelReady = false
				let frameCount = 0

				// 2. 初始化 MediaPipe
				const selfieSegmentation = new SelfieSegmentation({
					locateFile: (file) => {
						return `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
					},
				})

				selfieSegmentation.setOptions({
					modelSelection: 1, // Landscape
					selfieMode: false,
				})

				selfieSegmentation.onResults(onResults)

				// 3. 核心渲染回调
				function onResults(results) {
					isModelReady = true // 标记模型已有输出

					// --- A. 准备 Mask (JS -> Rust) ---
					maskCtx.clearRect(0, 0, MASK_WIDTH, MASK_HEIGHT)
					maskCtx.drawImage(results.segmentationMask, 0, 0, MASK_WIDTH, MASK_HEIGHT)
					const maskData = maskCtx.getImageData(0, 0, MASK_WIDTH, MASK_HEIGHT)

					const rustMaskPtr = processor.mask_ptr()
					const rustMaskView = new Float32Array(
						wasm.memory.buffer,
						rustMaskPtr,
						MASK_WIDTH * MASK_HEIGHT
					)

					// 提取 Alpha 通道并归一化 (MediaPipe Mask 是灰度图)
					for (let i = 0; i < MASK_WIDTH * MASK_HEIGHT; i++) {
						rustMaskView[i] = maskData.data[i * 4] / 255.0
					}

					// --- B. 准备原图 (JS -> Rust) ---
					// 注意：results.image 是 ImageBitmap，绘制非常快
					ctx.drawImage(results.image, 0, 0, WIDTH, HEIGHT)
					const imgData = ctx.getImageData(0, 0, WIDTH, HEIGHT)

					const rustInputPtr = processor.input_ptr()
					const rustInputView = new Uint8Array(
						wasm.memory.buffer,
						rustInputPtr,
						WIDTH * HEIGHT * 4
					)
					rustInputView.set(imgData.data)

					// --- C. Rust 处理 ---
					processor.apply_filter_and_blend()

					// --- D. 渲染结果 (Rust -> JS) ---
					const rustOutputPtr = processor.output_ptr()
					const rustOutputView = new Uint8ClampedArray(
						wasm.memory.buffer,
						rustOutputPtr,
						WIDTH * HEIGHT * 4
					)
					const finalImage = new ImageData(rustOutputView, WIDTH, HEIGHT)

					ctx.putImageData(finalImage, 0, 0)

					// 调试日志 (仅前几帧)
					if (frameCount++ < 5) console.log("Rendered frame via Rust")
				}

				// 4. 启动摄像头
				const video = document.getElementById("video")
				const stream = await navigator.mediaDevices.getUserMedia({
					video: { width: WIDTH, height: HEIGHT, frameRate: 30 },
				})
				video.srcObject = stream

				// 【关键修复 1】显式调用 play()
				await video.play()

				document.getElementById("stats").innerText = "Model Loading..."

				// 5. 驱动循环
				async function frameLoop() {
					// 【关键修复 2】降级渲染：如果 AI 还没准备好，直接显示原图，避免白屏
					if (!isModelReady) {
						ctx.drawImage(video, 0, 0, WIDTH, HEIGHT)
					}

					// 发送给 MediaPipe
					await selfieSegmentation.send({ image: video })

					requestAnimationFrame(frameLoop)
				}

				frameLoop()
			}

			main().catch(console.error)
		</script>
	</body>
</html>
