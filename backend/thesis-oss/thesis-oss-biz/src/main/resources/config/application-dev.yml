storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    accessKey: ${MINIO_ACCESS_KEY:test}
    secretKey: ${MINIO_SECRET_KEY:test123456}
  aliyun-oss:
    # OSS 服务的访问域名，请根据实际使用的 OSS 区域替换为对应的 endpoint
    endpoint: ${ALIYUN_OSS_ENDPOINT:xxx}
    # 阿里云账号的 AccessKey ID，用于身份验证
    accessKey: ${ALIYUN_OSS_ACCESS_KEY:xxx}
    # 阿里云账号的 AccessKey Secret，用于身份验证
    secretKey: ${ALIYUN_OSS_SECRET_KEY:xxx}
