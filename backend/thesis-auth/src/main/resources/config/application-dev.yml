logging:
  level:
    com.theoyu.thesis.auth.model.mapper: debug

spring:
  data:
    redis:
      database: ${REDIS_DATABASE:0} # Redis 数据库索引（默认为 0）
      host: ${REDIS_HOST:127.0.0.1} # Redis 服务器地址
      port: ${REDIS_PORT:6379} # Redis 服务器连接端口
      password: ${REDIS_PASSWORD:qwe123!@#} # Redis 服务器连接密码（默认为空）
      timeout: ${REDIS_TIMEOUT:5s} # 读超时时间
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:5s} # 链接超时时间
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:200} # 连接池最大连接数
          max-wait: ${REDIS_POOL_MAX_WAIT:-1ms} # 连接池最大阻塞等待时间（使用负值表示没有限制）
          min-idle: ${REDIS_POOL_MIN_IDLE:0} # 连接池中的最小空闲连接
          max-idle: ${REDIS_POOL_MAX_IDLE:10} # 连接池中的最大空闲连接

# 阿里云配置
aliyun:
  accessKeyId: ${ALIYUN_ACCESS_KEY_ID:}
  accessKeySecret: ${ALIYUN_ACCESS_KEY_SECRET:}

