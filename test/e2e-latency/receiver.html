<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<title>E2E延迟测试 - 接收端</title>
		<style>
			body {
				font-family: monospace;
				background: #1a1a1a;
				color: #eee;
				padding: 20px;
			}
			#status {
				margin: 10px 0;
				padding: 10px;
				background: #333;
				border-radius: 4px;
				white-space: pre-wrap;
				max-height: 200px;
				overflow-y: auto;
			}
			#remote-video {
				border: 1px solid #555;
				display: block;
				margin: 10px 0;
				background: #000;
			}
			#sample-canvas {
				border: 1px solid #555;
				display: block;
				margin: 10px 0;
			}
			#results {
				margin: 10px 0;
				padding: 10px;
				background: #222;
				border-radius: 4px;
			}
			label {
				display: block;
				margin: 6px 0 2px;
			}
			input,
			button {
				padding: 6px 12px;
				margin: 4px 0;
			}
			button {
				background: #0078d4;
				color: white;
				border: none;
				border-radius: 4px;
				cursor: pointer;
			}
			button:hover {
				background: #106ebe;
			}
			.section {
				margin: 16px 0;
				border-top: 1px solid #555;
				padding-top: 12px;
			}
			table {
				border-collapse: collapse;
				width: 100%;
				margin-top: 8px;
			}
			th,
			td {
				border: 1px solid #555;
				padding: 6px 10px;
				text-align: center;
			}
			th {
				background: #333;
			}
			.highlight {
				color: #4fc3f7;
				font-weight: bold;
			}
		</style>
	</head>
	<body>
		<h2>📥 E2E延迟测试 — 接收端</h2>
		<div class="section">
			<label>SFU 地址（Socket.io URL）</label>
			<input id="sfuUrl" value="http://localhost:3000" style="width: 280px" />
			<label>房间 ID（须与发送端一致）</label>
			<input id="roomId" value="e2e-test-room" />
			<label>用户 ID</label>
			<input id="userId" value="receiver-001" />
			<label>昵称</label>
			<input id="username" value="接收端" />
			<label>Token</label>
			<input id="token" value="test-token" />
			<label>参与者规模（仅用于标注，如 2/3/5）</label>
			<input id="participantCount" value="2" type="number" min="2" max="20" />
			<label>采样次数（默认 60）</label>
			<input id="sampleCount" value="60" type="number" min="10" max="500" />
			<br />
			<button onclick="startReceiver()">🚀 加入房间并开始采样</button>
			<button onclick="stopReceiver()" style="background: #c62828">⏹ 停止</button>
			<button onclick="exportResults()" style="background: #2e7d32">💾 导出 JSON</button>
		</div>
		<div id="status">等待操作…</div>

		<!-- 接收到的远程视频 -->
		<label>远程视频帧</label>
		<video id="remote-video" width="640" height="360" autoplay playsinline></video>

		<!-- 采样 Canvas（用于读取像素）-->
		<canvas id="sample-canvas" width="640" height="38" style="display: none"></canvas>

		<div class="section">
			<h3>📊 实时结果</h3>
			<div id="results">
				<table>
					<thead>
						<tr>
							<th>参与者规模</th>
							<th>已采样次数</th>
							<th>E2E延迟均值 (ms)</th>
							<th>E2E延迟最大值 (ms)</th>
							<th>当前延迟 (ms)</th>
						</tr>
					</thead>
					<tbody id="results-body">
						<tr>
							<td colspan="5">—</td>
						</tr>
					</tbody>
				</table>
			</div>
			<div id="raw-data" style="margin-top: 8px; color: #aaa; font-size: 12px; max-height: 120px; overflow-y: auto"></div>
		</div>

		<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/mediasoup-client@3.7.8/dist/mediasoup-client.min.js"></script>
		<script>
			let socket = null
			let device = null
			let recvTransport = null
			let sendTransport = null
			let activeConsumer = null // 只关注第一个 video consumer
			let samplingActive = false
			let sampleResults = []
			let animFrameId = null

			const videoEl = document.getElementById("remote-video")
			const sampleCanvas = document.getElementById("sample-canvas")
			const sampleCtx = sampleCanvas.getContext("2d", { willReadFrequently: true })

			// ─── 日志 ────────────────────────────────────────────────────────────────
			function log(msg) {
				const el = document.getElementById("status")
				el.innerText = new Date().toLocaleTimeString() + "  " + msg + "\n" + el.innerText
				console.log("[Receiver]", msg)
			}

			function emitAsync(eventName, data) {
				return new Promise((resolve, reject) => {
					socket.emit(eventName, data, (response) => {
						if (response && response.error) return reject(new Error(response.error))
						resolve(response)
					})
				})
			}

			// ─── OCR-like 时间戳读取 ─────────────────────────────────────────────────
			/**
			 * 从视频帧顶部裁剪时间戳区域（高 38px），通过 Canvas getImageData 读取像素，
			 * 再用原生 Canvas measureText 辅助读取文字（利用发送端的定长格式解析）。
			 *
			 * 由于浏览器端无法直接做完整 OCR，这里采用"像素哈希校验 + 发送端固定格式"方案：
			 *   - 发送端将 13 位时间戳（Date.now()）写在 Canvas 左上角 "TS:xxxxxxxxxxxxx"
			 *   - 接收端将视频帧绘入 sample-canvas，读取顶部黑底白字区域的亮度行，
			 *     通过对比亮度分布还原数字（简化：用 getImageData 直接读 R 通道构造伪OCR）
			 *
			 * 实际可靠读取方案：借助 tesseract.js 或直接使用 "发送端 postMessage + BroadcastChannel" 传时间戳。
			 * 本测试脚本采用 BroadcastChannel 方案（同一浏览器多标签页），精度更高。
			 */

			// ─── BroadcastChannel 方案（推荐，同浏览器多标签） ──────────────────────
			let bc = null
			let lastSentTs = null // 发送端广播的最新时间戳
			let videoFrameReceived = false

			function initBroadcastChannel() {
				bc = new BroadcastChannel("e2e-latency-ts")
				bc.onmessage = (evt) => {
					if (evt.data && evt.data.type === "timestamp") {
						lastSentTs = evt.data.ts
					}
				}
			}

			// ─── 采样循环 ─────────────────────────────────────────────────────────────
			function startSampling() {
				const targetCount = parseInt(document.getElementById("sampleCount").value) || 60
				samplingActive = true
				sampleResults = []
				log(`开始采样，目标 ${targetCount} 次…`)

				function sample() {
					if (!samplingActive) return

					if (sampleResults.length >= targetCount) {
						samplingActive = false
						finalizeSampling()
						return
					}

					// 方案 A：BroadcastChannel（同浏览器多标签页）
					if (lastSentTs !== null && videoEl.readyState >= 2 && videoEl.videoWidth > 0) {
						const recvTs = Date.now()
						const latency = recvTs - lastSentTs

						// 过滤异常值（负数或超过 5 秒的明显错误值）
						if (latency > 0 && latency < 5000) {
							sampleResults.push(latency)
							updateResultsTable()
							appendRawData(sampleResults.length, lastSentTs, recvTs, latency)
						}
					}

					// 约 200ms 采一次（避免同一帧重复采样）
					setTimeout(() => requestAnimationFrame(sample), 200)
				}

				requestAnimationFrame(sample)
			}

			function finalizeSampling() {
				if (sampleResults.length === 0) {
					log("无有效采样数据")
					return
				}
				const avg = Math.round(sampleResults.reduce((a, b) => a + b, 0) / sampleResults.length)
				const max = Math.max(...sampleResults)
				log(`采样完成 | 均值=${avg}ms | 最大值=${max}ms | 有效样本=${sampleResults.length}`)
				updateResultsTable(avg, max)
			}

			function updateResultsTable(avg, max) {
				const n = sampleResults.length
				const curAvg = avg !== undefined ? avg : n > 0 ? Math.round(sampleResults.reduce((a, b) => a + b, 0) / n) : 0
				const curMax = max !== undefined ? max : n > 0 ? Math.max(...sampleResults) : 0
				const latest = sampleResults[n - 1] || 0
				const scale = document.getElementById("participantCount").value

				document.getElementById("results-body").innerHTML = `
        <tr>
          <td>${scale} 人</td>
          <td class="highlight">${n}</td>
          <td class="highlight">${curAvg}</td>
          <td class="highlight">${curMax}</td>
          <td>${latest}</td>
        </tr>`
			}

			function appendRawData(idx, sentTs, recvTs, latency) {
				const el = document.getElementById("raw-data")
				el.innerText = `[${idx}] sentTs=${sentTs} recvTs=${recvTs} latency=${latency}ms\n` + el.innerText
			}

			// ─── 主流程 ─────────────────────────────────────────────────────────────
			async function startReceiver() {
				initBroadcastChannel()

				const sfuUrl = document.getElementById("sfuUrl").value.trim()
				const rid = document.getElementById("roomId").value.trim()
				const uid = document.getElementById("userId").value.trim()
				const uname = document.getElementById("username").value.trim()
				const token = document.getElementById("token").value.trim()

				log("连接 SFU…")
				socket = io(sfuUrl, { auth: { token }, transports: ["websocket"] })
				await new Promise((res, rej) => {
					socket.on("connect", res)
					socket.on("connect_error", rej)
				})
				log("Socket 已连接，加入房间…")

				const joinResp = await emitAsync("joinRoom", { roomId: rid, userId: uid, username: uname, token })
				log(`已加入房间，peerId=${joinResp.peerId}，其他参与者：${joinResp.peers.length}`)

				const { rtpCapabilities } = await emitAsync("getRouterRtpCapabilities", { roomId: rid })
				device = new window.mediasoupClient.Device()
				await device.load({ routerRtpCapabilities: rtpCapabilities })

				// Recv Transport
				const recvParams = await emitAsync("createWebRtcTransport", { roomId: rid, producing: false, consuming: true })
				recvTransport = device.createRecvTransport(recvParams)
				recvTransport.on("connect", ({ dtlsParameters }, callback, errback) => {
					emitAsync("connectWebRtcTransport", { roomId: rid, transportId: recvParams.id, dtlsParameters }).then(callback).catch(errback)
				})

				// Send Transport（用于加入信令但不发布媒体，部分 SFU 要求建立双向 transport）
				const sendParams = await emitAsync("createWebRtcTransport", { roomId: rid, producing: true, consuming: false })
				sendTransport = device.createSendTransport(sendParams)
				sendTransport.on("connect", ({ dtlsParameters }, callback, errback) => {
					emitAsync("connectWebRtcTransport", { roomId: rid, transportId: sendParams.id, dtlsParameters }).then(callback).catch(errback)
				})
				sendTransport.on("produce", (_, callback) => callback({ id: "noop" }))

				// 订阅已有参与者的视频
				let subscribed = false
				for (const peer of joinResp.peers) {
					for (const producer of peer.producers || []) {
						if (producer.kind === "video" && !subscribed) {
							await subscribeVideoProducer(producer.id, rid)
							subscribed = true
						}
					}
				}

				// 监听新 Producer
				socket.on("newProducer", async ({ producerId, kind }) => {
					if (kind === "video" && !activeConsumer) {
						await subscribeVideoProducer(producerId, rid)
					}
				})

				// 等待视频帧到达后开始采样
				if (subscribed) {
					videoEl.onloadeddata = () => {
						if (!videoFrameReceived) {
							videoFrameReceived = true
							startSampling()
						}
					}
					if (videoEl.readyState >= 2) {
						videoFrameReceived = true
						startSampling()
					}
				} else {
					log("暂未发现视频生产者，等待 newProducer 事件…")
					socket.on("newProducer", async ({ producerId, kind }) => {
						if (kind === "video" && !activeConsumer) {
							await subscribeVideoProducer(producerId, rid)
							videoEl.onloadeddata = () => {
								if (!videoFrameReceived) {
									videoFrameReceived = true
									startSampling()
								}
							}
						}
					})
				}
			}

			async function subscribeVideoProducer(producerId, rid) {
				try {
					const consumerParams = await emitAsync("consume", {
						roomId: rid,
						producerId,
						rtpCapabilities: device.rtpCapabilities,
					})
					activeConsumer = await recvTransport.consume(consumerParams)
					await emitAsync("resumeConsumer", { roomId: rid, consumerId: activeConsumer.id })

					// 绑定到 video 元素
					videoEl.srcObject = new MediaStream([activeConsumer.track])
					await videoEl.play().catch(() => {})
					log(`已订阅视频 producer=${producerId}，等待帧数据…`)
				} catch (e) {
					log("订阅失败: " + e.message)
				}
			}

			function stopReceiver() {
				samplingActive = false
				if (animFrameId) {
					cancelAnimationFrame(animFrameId)
					animFrameId = null
				}
				if (socket) {
					socket.disconnect()
					socket = null
				}
				if (recvTransport) {
					recvTransport.close()
					recvTransport = null
				}
				if (sendTransport) {
					sendTransport.close()
					sendTransport = null
				}
				if (bc) {
					bc.close()
					bc = null
				}
				activeConsumer = null
				lastSentTs = null
				videoFrameReceived = false
				log("已停止")
			}

			function exportResults() {
				const n = sampleResults.length
				if (n === 0) {
					alert("暂无数据")
					return
				}
				const avg = Math.round(sampleResults.reduce((a, b) => a + b, 0) / n)
				const max = Math.max(...sampleResults)
				const scale = document.getElementById("participantCount").value
				const data = {
					participantCount: parseInt(scale),
					sampleCount: n,
					avgLatencyMs: avg,
					maxLatencyMs: max,
					rawSamples: sampleResults,
					collectedAt: new Date().toISOString(),
				}
				const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" })
				const a = document.createElement("a")
				a.href = URL.createObjectURL(blob)
				a.download = `e2e-latency-${scale}p-${Date.now()}.json`
				a.click()
			}
		</script>
	</body>
</html>
