spring:
  application:
    name: thesis-chat # 应用名称
  profiles:
    active: dev # 默认激活 dev 本地开发环境
  cloud:
    nacos:
      discovery:
        enabled: true # 启用服务发现
        group: DEFAULT_GROUP # 所属组
        namespace: thesis # 命名空间
        server-addr: 127.0.0.1:8848 # 指定 Nacos 配置中心的服务器地址
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1} # 多实例部署时由环境变量指定真实 Pod/主机 IP
        port: ${server.port}
        metadata:
          instanceId: ${APP_INSTANCE_ID:${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}:${random.uuid}}
