server:
  port: 8086 # 项目启动的端口F

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml


grpc:
  server:
    port: 50051
    # 启用反射服务（开发环境）
    enable-reflection: true
    # 最大消息大小 (10MB)
    max-inbound-message-size: 10485760
    # 启用健康检查
    health-service-enabled: true
    # 启用 keep-alive
    permit-keep-alive-without-calls: true
    permit-keep-alive-time: 300s
