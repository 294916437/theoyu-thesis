services:
  # MySQL 服务
  mysql_1:
    image: mysql:8.0
    container_name: mysql_1
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
    volumes:
      - mysql_data_volumn:/var/lib/mysql
      - "/mnt/e/linux/docker/mysql/config/my.cnf:/etc/mysql/my.cnf"

  # Redis 服务
  redis_1:
    image: redis:7.2.3
    container_name: redis_1
    ports:
      - "6379:6379"
    volumes:
      - "/mnt/e/linux/docker/redis/config/redis.conf:/etc/redis/redis.conf"
      - "/mnt/e/linux/docker/redis/data:/data"
      - "/mnt/e/linux/docker/redis/modules:/etc/redis/modules"
    command: ["redis-server", "/etc/redis/redis.conf", "--appendonly", "yes"]

  # Minio 服务
  minio:
    image: minio/minio:RELEASE.2023-09-30T07-02-29Z
    container_name: minio
    ports:
      - "9000:9000"
      - "9090:9090"
    volumes:
      - "/mnt/e/linux/docker/minio/data:/data"
    environment:
      MINIO_ROOT_USER: test
      MINIO_ROOT_PASSWORD: test123456
    command: server /data --console-address ":9090"

  # Nacos 服务
  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: nacos
    depends_on:
      - mysql_1
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - "/mnt/e/linux/docker/nacos/data:/home/nacos/data"
      - "/mnt/e/linux/docker/nacos/logs:/home/nacos/logs"
    environment:
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=mysql_1
      - MYSQL_SERVICE_DB_NAME=nacos_config
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=123456
      - MYSQL_SERVICE_DB_PARAM=characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true

  # Cassandra 服务
  cassandra:
    image: cassandra:5.0
    container_name: cassandra
    ports:
      - "9042:9042"
    environment:
      - MAX_HEAP_SIZE=2G
      - HEAP_NEWSIZE=400M
    volumes:
      - "/mnt/e/linux/docker/cassandra/data:/var/lib/cassandra"

  # ZooKeeper 服务
  zookeeper:
    image: zookeeper:3.5.6
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - "/mnt/e/linux/docker/zookeeper/data:/data"
      - "/mnt/e/linux/docker/zookeeper/conf:/conf"

volumes:
  mysql_data_volumn:
    external: true
