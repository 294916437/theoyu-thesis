spring:
  application:
    name: thesis-oss # 应用名称
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev} # 默认激活 dev 本地开发环境
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_CONFIG_SERVER_ADDR:http://127.0.0.1:8848} # 指定 Nacos 配置中心的服务器地址
        prefix: ${spring.application.name} # 配置 Data Id 前缀，这里使用应用名称作为前缀
        group: ${NACOS_CONFIG_GROUP:DEFAULT_GROUP} # 所属组
        namespace: ${NACOS_CONFIG_NAMESPACE:thesis} # 命名空间
        file-extension: yaml # 配置文件格式
        refresh-enabled: true # 是否开启动态刷新
      discovery:
        enabled: true # 启用服务发现
        group: ${NACOS_DISCOVERY_GROUP:DEFAULT_GROUP} # 所属组
        namespace: ${NACOS_DISCOVERY_NAMESPACE:thesis} # 命名空间
        server-addr: ${NACOS_DISCOVERY_SERVER_ADDR:127.0.0.1:8848} # 指定 Nacos 注册中心的服务器地址
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1} # 多实例部署时由环境变量注入 Pod/主机 IP
        port: ${NACOS_DISCOVERY_PORT:${server.port}}
        metadata:
          instanceId: "${APP_INSTANCE_ID:${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}:${random.uuid}}"
