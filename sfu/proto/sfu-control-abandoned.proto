syntax = "proto3";

package sfu.control;

// ==================== 消息定义 ====================

message RecordingConfig {
  int32 video_width = 1;
  int32 video_height = 2;
  int32 video_bitrate = 3;
  int32 video_framerate = 4;
  string video_codec = 5;
  int32 audio_bitrate = 6;
  string audio_codec = 7;
  string format = 8;
}

message StartRecordingRequest {
  string room_id = 1;
  string host_id = 2;
  RecordingConfig config = 3;
}

message StartRecordingResponse {
  bool success = 1;
  string message = 2;
  string host_id = 3;
}

message StopRecordingRequest {
  string room_id = 1;
  string host_id = 2;
}

message StopRecordingResponse {
  bool success = 1;
  string message = 2;
  string file_url = 3;
}

message RecordingStatusRequest {
  string room_id = 1;
  string host_id = 2;
}

message RecordingStatusResponse {
  bool is_recording = 1;
  int64 duration_seconds = 2;
  int64 file_size_bytes = 3;
}

// ==================== 服务定义 (Node实现供Java调用) ====================

service SFUControlService {
  // 录制接口
  rpc StartRecording (StartRecordingRequest) returns (StartRecordingResponse);
  rpc StopRecording (StopRecordingRequest) returns (StopRecordingResponse);
  rpc GetRecordingStatus (RecordingStatusRequest) returns (RecordingStatusResponse);
}