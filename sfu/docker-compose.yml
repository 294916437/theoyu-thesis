version: "3.8"

services:
  sfu-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sfu-server
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "40000-40100:40000-40100/udp"
      - "40000-40100:40000-40100/tcp"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - MEDIASOUP_LISTEN_IP=0.0.0.0
      - MEDIASOUP_ANNOUNCED_IP=${PUBLIC_IP}
      - RTC_MIN_PORT=40000
      - RTC_MAX_PORT=40100
      - GRPC_HOST=spring-cloud-service
      - GRPC_PORT=50051
      - NACOS_SERVER=nacos:8848
    volumes:
      - ./logs:/app/logs
    networks:
      - sfu-network
    depends_on:
      - nacos

  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: nacos
    restart: unless-stopped
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
    networks:
      - sfu-network

networks:
  sfu-network:
    driver: bridge
